# Nginx 配置文件
# 用于代理 API 请求到不同的后端服务

upstream nextjs_backend {
    server localhost:3000;
}

upstream java_backend {
    server localhost:8080;
}

server {
    listen 80;
    server_name localhost;

    # 客户端请求体大小限制
    client_max_body_size 10M;

    # 日志配置
    access_log /var/log/nginx/api-gateway-admin-access.log;
    error_log /var/log/nginx/api-gateway-admin-error.log;

    # /api/center 端点 - 代理到 Java 后端 (localhost:8080/api/v1)
    location /api/center {
        # 移除 /api/center 前缀，转发到 Java 后端
        # 例如: /api/center/api/v1/xxx -> /api/v1/xxx
        rewrite ^/api/center/(.*)$ /$1 break;
        
        proxy_pass http://java_backend;
        proxy_http_version 1.1;
        
        # 请求头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 缓冲设置
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # /api/admin 端点 - 代理到 Next.js 后端 (localhost:3000/api)
    location /api/admin {
        # 移除 /api/admin 前缀，转发到 Next.js 的 /api
        # 例如: /api/admin/xxx -> /api/xxx
        rewrite ^/api/admin/(.*)$ /api/$1 break;
        
        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;
        
        # 请求头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 支持（如果需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 缓冲设置
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Next.js 应用 - 其他所有请求都转发到 Next.js
    location / {
        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;
        
        # 请求头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 缓冲设置
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

